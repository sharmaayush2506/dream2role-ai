# Render blueprint: https://render.com/docs/blueprint-spec
# Deploys the whole app (React frontend + Express API) as one free web service.
services:
  - type: web
    name: dream2role
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      # Random secret for login tokens, generated by Render.
      - key: JWT_SECRET
        generateValue: true
      # Demo checkout (no real money) so evaluators can try certificates.
      - key: DEMO_PAYMENTS
        value: "1"
      # Adds demo learners on startup so Friends and the leaderboard aren't empty.
      - key: SEED_DEMO
        value: "1"
      # Paste your Gemini key in the Render dashboard when asked (it's never stored in git).
      - key: GEMINI_API_KEY
        sync: false
